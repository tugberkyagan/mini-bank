name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t mini-bank:${{ github.sha }} .
      - name: Log in to GHRC
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag mini-bank:${{ gihub.sha }} ghcr.io/tugberkyagan/mini-bank:${{ github.sha }}
          docker push ghcr.io/tugberkyagan/mini-bank:${{ github.sha }}